<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UL Business">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/ULbussineslogo.png"/>

  <title>UL Business</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #0B0E14;
      color: #F8FAFC;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ul-preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(59, 130, 246, 0.14), #0B0E14 65%);
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #ul-preloader img {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      object-fit: cover;
      border: 1px solid rgba(59, 130, 246, 0.35);
      box-shadow: 0 0 36px rgba(59, 130, 246, 0.25);
      animation: ulPulse 1.6s ease-in-out infinite;
    }
    #ul-preloader p {
      margin-top: 16px;
      font-size: 13px;
      color: #94A3B8;
      letter-spacing: 0.3px;
    }
    @keyframes ulPulse {
      0%, 100% { transform: scale(0.97); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <div id="ul-preloader">
    <img src="assets/assets/ULbussineslogo.png" alt="UL Business" />
    <p>Carregando UL Business...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('ul-preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
